<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Import Systems — Trakref V4 Design Spec</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',-apple-system,sans-serif;background:#f5f5f5;color:rgba(26,23,59,0.87)}
.shell{max-width:900px;margin:0 auto}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid rgba(0,0,0,0.12);position:sticky;top:0;z-index:100}
.tab{padding:10px 14px;border:none;border-bottom:2px solid transparent;background:transparent;font-size:11px;font-family:inherit;color:rgba(26,23,59,0.6);cursor:pointer;white-space:nowrap}
.tab.active{color:#00859b;border-bottom-color:#00859b;font-weight:600}
.view{display:none;min-height:460px}
.view.active{display:block}
.bg{background:#f9f9f9;padding:32px}
.bc{font-size:10px;color:#707579;letter-spacing:0.73px;margin-bottom:16px}
.page-hdr{display:flex;align-items:center;gap:24px;margin-bottom:24px}
.page-title{font-size:22px;font-weight:400;color:#1a173b}
.card{background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:5px;padding:24px;box-shadow:0px 3px 1px -2px rgba(0,0,0,0.2),0px 2px 2px rgba(0,0,0,0.14),0px 1px 5px rgba(0,0,0,0.12);max-width:720px}
.card p{font-size:14px;color:rgba(26,23,59,0.6);line-height:1.43;margin-bottom:20px}
.btns{display:flex;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 22px;border-radius:4px;font-size:14px;font-family:inherit;letter-spacing:0.4px;text-transform:uppercase;cursor:pointer;border:none}
.btn-fill{background:#00859b;color:#fff}
.btn-outline{background:transparent;border:1px solid rgba(0,133,155,0.5);color:#00859b}
.btn-text{background:transparent;color:#00859b;padding:6px 8px;border:none}
.btn-disabled{background:rgba(26,23,59,0.12);color:rgba(26,23,59,0.38);cursor:not-allowed}
.overlay{position:relative;background:#f9f9f9;min-height:460px;display:flex;align-items:center;justify-content:center}
.overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.modal{position:relative;z-index:10;background:#fff;border-radius:4px;width:520px;box-shadow:0px 8px 10px -5px rgba(0,0,0,0.2),0px 16px 24px 2px rgba(0,0,0,0.14),0px 6px 30px 5px rgba(0,0,0,0.12);overflow:hidden}
.modal-title{padding:16px 24px;font-size:20px;font-weight:700}
.modal-body{padding:0 24px 20px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:8px}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.step-group{display:flex;align-items:center;gap:8px;flex-shrink:0}
.step-circle{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.step-active{background:#00859b}
.step-future{background:rgba(26,23,59,0.38)}
.step-label{font-size:14px;white-space:nowrap}
.step-label-active{color:rgba(26,23,59,0.87)}
.step-label-future{color:rgba(26,23,59,0.6)}
.step-line{flex:1 0 0;height:1px;min-width:8px;background:#bdbdbd}
.dropzone{border:2px dashed #e0e0e0;border-radius:4px;padding:36px 20px;text-align:center;background:#f9f9f9}
.dropzone p{margin:0}
.dropzone .main{font-size:16px;color:rgba(26,23,59,0.87);margin-top:12px;margin-bottom:4px}
.dropzone .sub{font-size:12px;color:rgba(26,23,59,0.38)}
.dropzone .link{color:#00859b}
.file-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:4px;background:#f9f9f9;border:1px solid rgba(0,0,0,0.12)}
.file-row .name{font-size:14px;font-weight:500;color:rgba(26,23,59,0.87)}
.file-row .meta{font-size:12px;color:rgba(26,23,59,0.6)}
.file-row .x{background:none;border:none;cursor:pointer;font-size:18px;color:rgba(26,23,59,0.6)}
.alert-success{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:4px;background:#edf7ed;margin-top:12px;font-size:14px;color:#1e4620}
.alert-error{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:4px;background:#fdeded}
.alert-error .title{font-size:14px;font-weight:600;color:#5f2120;margin-bottom:2px}
.alert-error .desc{font-size:14px;color:#5f2120}
.spinner-wrap{text-align:center;padding:20px 0}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top:3px solid #00859b;border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{margin-top:20px;background:#e0e0e0;border-radius:2px;height:4px;overflow:hidden}
.progress-bar{height:100%;background:#00859b;border-radius:2px}
.result-icon{text-align:center;margin-bottom:16px}
.result-icon .msg-title{font-size:16px;font-weight:600;margin:8px 0 4px}
.result-icon .msg-sub{font-size:14px;color:rgba(26,23,59,0.6)}
.summary{display:flex;gap:12px;margin-bottom:16px}
.summary-tile{flex:1;padding:12px;border-radius:4px;text-align:center}
.summary-tile .num{font-size:22px;font-weight:700}
.summary-tile .lbl{font-size:12px}
.post-note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:4px;background:#f9f9f9;border:1px solid rgba(0,0,0,0.12);font-size:12px;color:rgba(26,23,59,0.6)}
.post-note strong{color:rgba(26,23,59,0.87)}
.tbl-wrap{border-radius:4px;border:1px solid rgba(0,0,0,0.12);overflow:auto;background:#fff;margin-bottom:16px}
table{border-collapse:collapse;width:100%;min-width:700px}
th{font-size:12px;font-weight:700;padding:10px 12px;text-align:left;background:#f9f9f9;border-bottom:1px solid rgba(0,0,0,0.12);white-space:nowrap}
td{font-size:14px;padding:9px 12px;border-bottom:1px solid rgba(0,0,0,0.12)}
.s-ok{background:#C6EFCE;color:#1e4620;font-weight:700;font-size:13px}
.s-fail{background:#FFC7CE;color:#5f2120;font-weight:700;font-size:13px}
.f-warn{background:#FFFFCC}
.legend{display:flex;gap:20px;font-size:12px;color:rgba(26,23,59,0.6)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-sw{width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,0.12)}
.col-ref{margin-top:24px}
.col-ref h3{font-size:16px;font-weight:700;margin-bottom:12px}
.col-ref table{min-width:auto}
.col-ref th{font-size:11px;background:#f5f5f5}
.col-ref td{font-size:13px;vertical-align:top}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:3px;font-weight:600}
.badge-req{background:#e3f2fd;color:#1565c0}
.badge-opt{background:#f5f5f5;color:rgba(26,23,59,0.6)}
.badge-locked{background:#e0e0e0;color:#757575}
.access-denied{background:#fff;min-height:460px;display:flex;align-items:center;justify-content:center}
.ad-card{width:448px;text-align:center}
.ad-inner{background:#fff;border-radius:6px;border:0.667px solid rgba(0,0,0,0.12);box-shadow:0px 3px 1px -2px rgba(0,0,0,0.2),0px 2px 2px rgba(0,0,0,0.14),0px 1px 5px rgba(0,0,0,0.12);padding:33px;margin-bottom:24px}
.ad-icon{width:80px;height:80px;border-radius:50%;background:rgba(211,47,47,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 24px}
.ad-title{font-size:16px;margin-bottom:16px}
.ad-sub{font-size:16px;color:rgba(26,23,59,0.38);margin-bottom:24px}
.ad-footer{font-size:16px;color:rgba(26,23,59,0.38)}
.ad-btn{font-size:16px;font-family:inherit;padding:10px 24px;height:44px;background:#00859b;color:#fff;border:none;border-radius:4px;cursor:pointer}
.icon{display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div class="shell">
<div class="tabs" id="tabs"></div>
<div id="views"></div>
</div>
<script>
var views=[
{id:"systems-page",label:"1. Import Systems Page",html:function(){return '<div class="bg"><p class="bc">Home > Geek Command Center > Import Customer Data > Import Systems</p><div class="page-hdr"><span style="font-size:24px;cursor:pointer">&#10005;</span><span class="page-title">Import Systems</span></div><div class="card"><p>Import Systems Template (.xls or .xlsx) with data entered on the worksheet titled \'ImportSystems\'. The first row is ignored for column titles. Required fields are marked with an asterisk (*) and ordered first. Template includes account-specific dropdown values for Location, Material Type, Manufacturer, and other reference data.</p><div class="btns"><button class="btn btn-outline">&#11015; DOWNLOAD TEMPLATE</button><button class="btn btn-fill">&#11014; IMPORT SYSTEMS</button></div></div></div>';}},
{id:"modal-empty",label:"2. Upload Modal (empty)",html:function(){return overlay(stepper(0)+'<div class="dropzone"><div style="font-size:36px;color:#bdbdbd">&#11014;</div><p class="main">Drag &amp; drop your file here, or <span class="link">browse</span></p><p class="sub">Accepted formats: .xls, .xlsx</p></div>','<button class="btn btn-disabled">UPLOAD</button>');}},
{id:"modal-review",label:"3. Step 1: File Reviewed",html:function(){return overlay(stepper(0)+'<div class="file-row"><span class="icon">&#128196;</span><div style="flex:1"><div class="name">Target_RefrigerationSystems_2026.xlsx</div><div class="meta">156 KB &middot; Sheet: ImportSystems &#10003;</div></div><button class="x">&#10005;</button></div><div class="alert-success"><span style="color:#2e7d32">&#10004;</span> File structure validated &mdash; ready to import</div>','<button class="btn btn-text">CANCEL</button><button class="btn btn-fill">UPLOAD</button>');}},
{id:"modal-validating",label:"4. Step 2: Validate & Import",html:function(){return overlay(stepper(1)+'<div class="spinner-wrap"><div class="spinner"></div><p style="font-size:16px;font-weight:500;margin-bottom:4px">Validating &amp; importing systems...</p><p style="font-size:14px;color:rgba(26,23,59,0.6)">Running row-by-row validations and importing valid rows</p><div class="progress"><div class="progress-bar" style="width:65%"></div></div><p style="font-size:12px;color:rgba(26,23,59,0.38);margin-top:8px">Processing row 13 of 20&hellip;</p></div>','');}},
{id:"modal-success",label:"5a. All Succeeded",html:function(){return overlay(stepper(3)+'<div class="result-icon"><div style="font-size:40px;color:#2e7d32">&#10004;</div><p class="msg-title">Import Successful</p><p class="msg-sub">All systems were imported successfully.</p></div>'+summaryBar(20,0,20)+postNote("Systems"),'<button class="btn btn-fill">DONE</button>');}},
{id:"modal-partial",label:"5b. Partial Success",html:function(){return overlay(stepper(3)+'<div class="result-icon"><div style="font-size:40px;color:#ed6c02">&#9888;</div><p class="msg-title">Import Partially Successful</p><p class="msg-sub">Some rows had validation errors. Review the post-upload file to correct errors.</p></div>'+summaryBar(14,6,20)+postNote("Systems"),'<button class="btn btn-fill">DONE</button>');}},
{id:"modal-fail",label:"5c. All Failed",html:function(){return overlay(stepper(3)+'<div class="result-icon"><div style="font-size:40px;color:#d32f2f">&#9888;</div><p class="msg-title">Import Not Successful</p><p class="msg-sub">All rows had validation errors. Review the post-upload file to correct errors.</p></div>'+summaryBar(0,20,20)+postNote("Systems"),'<button class="btn btn-text">CLOSE</button><button class="btn btn-fill">TRY AGAIN</button>');}},
{id:"modal-file-error",label:"6. File Structure Error",html:function(){return overlay(stepper(0)+'<div class="file-row" style="margin-bottom:12px"><span style="color:#d32f2f">&#128196;</span><div style="flex:1"><div class="name">WrongFormat.csv</div><div class="meta">8 KB</div></div><button class="x">&#10005;</button></div><div class="alert-error"><span style="color:#d32f2f;font-size:20px;flex-shrink:0">&#9888;</span><div><div class="title">Import is not possible</div><div class="desc">Please use the template and format provided. Accepted: .xls or .xlsx with the worksheet &ldquo;ImportSystems&rdquo;.</div></div></div>','<button class="btn btn-text">CANCEL</button><button class="btn btn-outline">&#11015; DOWNLOAD TEMPLATE</button>');}},
{id:"post-upload",label:"7. Post-Upload File",html:function(){var rows=[{s:"Success",n:"RTU-01",t:"Comfort Cooling",l:"Main Warehouse",c:"12 lbs",e:[]},{s:"Success",n:"Chiller-3A",t:"Refrigeration",l:"North Service HQ",c:"85 lbs",e:[]},{s:"Failed",n:"",t:"Process Cooling",l:"South Bay Depot",c:"40 lbs",e:["n"]},{s:"Success",n:"Walk-In-02",t:"Refrigeration",l:"East Facility",c:"22 lbs",e:[]},{s:"Failed",n:"AHU-15",t:"",l:"West Campus",c:"55 lbs",e:["t"]}];var trs=rows.map(function(r){return "<tr><td class=\"s-"+(r.s==="Success"?"ok":"fail")+"\">"+r.s+"</td><td"+(r.e.indexOf("n")>-1?" class=\"f-warn\"":"")+">"+(r.n||"&mdash;")+"</td><td"+(r.e.indexOf("t")>-1?" class=\"f-warn\"":"")+">"+(r.t||"&mdash;")+"</td><td>"+r.l+"</td><td>"+r.c+"</td></tr>";}).join("");return '<div class="bg"><p style="font-size:16px;font-weight:700;margin-bottom:4px">Post-Upload File Preview</p><p style="font-size:12px;color:rgba(26,23,59,0.6);margin-bottom:4px">SystemsPostUpload-20260303-143022.xlsx</p><p style="font-size:12px;color:rgba(26,23,59,0.38);margin-bottom:16px">Auto-downloaded after import completes</p><div class="tbl-wrap"><table><thead><tr><th>Import Status</th><th>System Name *</th><th>System Type *</th><th>Location *</th><th>Full Charge *</th></tr></thead><tbody>'+trs+'</tbody></table></div><div class="legend"><div class="legend-item"><div class="legend-sw" style="background:#C6EFCE"></div> Success (#C6EFCE)</div><div class="legend-item"><div class="legend-sw" style="background:#FFC7CE"></div> Failed (#FFC7CE)</div><div class="legend-item"><div class="legend-sw" style="background:#FFFFCC"></div> Field Error (#FFFFCC)</div></div></div>';}},
{id:"template-cols",label:"8. Template Columns",html:function(){var cols=[["A","Import Status","Locked","System","Auto-populated after import. Do not edit."],["B","System Name","Yes","Text","Required. Unique name for the system."],["C","System Type","Yes","Dropdown","Comfort Cooling, Refrigeration, or Process Cooling."],["D","Location","Yes","Dropdown","Service Location type. Account-specific values."],["E","Sublocation","No","Dropdown","Account-specific values."],["F","Manufacturer","No","Dropdown","Account-specific values."],["G","Model","No","Text","Optional."],["H","Serial Number","No","Text","Optional."],["I","Year Manufactured","No","Number","4-digit year. Optional."],["J","Full Charge (lbs)","Yes","Number","Total refrigerant charge in pounds. Required."],["K","Refrigerant Type","Yes","Dropdown","Material type. Account-specific values."],["L","Acquired From","No","Dropdown","Wholesaler/Supplier location type. Account-specific."],["M","Date Acquired","No","Date","MM/DD/YYYY format. Optional."],["N","Notes","No","Text","Optional."]];var trs=cols.map(function(c,i){var badge=c[2]==="Locked"?"locked":c[2]==="Yes"?"req":"opt";return "<tr"+(i%2===1?" style=\"background:#fafafa\"":"")+'><td><code>'+c[0]+'</code></td><td>'+c[1]+'</td><td><span class="badge badge-'+badge+'">'+c[2]+'</span></td><td>'+c[3]+'</td><td>'+c[4]+'</td></tr>';}).join("");return '<div class="bg"><p style="font-size:16px;font-weight:700;margin-bottom:4px">ImportSystemsTemplate.xlsx &mdash; Column Reference</p><p style="font-size:12px;color:rgba(26,23,59,0.6);margin-bottom:16px">Worksheet: &ldquo;ImportSystems&rdquo; &middot; Row 1 = headers (ignored during import)</p><div class="legend" style="margin-bottom:16px"><div class="legend-item"><div class="legend-sw" style="background:#e3f2fd;border-color:#90caf9"></div> Required *</div><div class="legend-item"><div class="legend-sw" style="background:#f5f5f5"></div> Optional</div><div class="legend-item"><div class="legend-sw" style="background:#e0e0e0;border-color:#bdbdbd"></div> Locked</div></div><div class="tbl-wrap"><table class="col-ref" style="min-width:auto"><thead><tr><th>Col</th><th>Field</th><th>Required</th><th>Type</th><th>Notes</th></tr></thead><tbody>'+trs+'</tbody></table></div><div style="padding:14px;border-radius:4px;background:#e8f4fd;border:1px solid #90caf9;font-size:12px;color:#0d47a1"><strong>Account-specific dropdowns:</strong> Location, Sublocation, Manufacturer, Refrigerant Type, and Acquired From are populated with values from the current account at time of template download.</div></div>';}},
{id:"access-denied",label:"9. Access Denied",html:function(){return '<div class="access-denied"><div class="ad-card"><div class="ad-inner"><div class="ad-icon"><span style="font-size:48px;color:#d32f2f">&#9888;</span></div><p class="ad-title">Access Denied</p><p class="ad-sub">You do not have permission to access this page.</p><button class="ad-btn">Go Back</button></div><p class="ad-footer">If you believe you should have access to this page, please contact your System Administrator.</p></div></div>';}}
];
function stepper(cur){var steps=["Review File","Validate & Import","Complete"];var h='<div class="stepper">';for(var i=0;i<steps.length;i++){var done=i<cur,active=i===cur,future=!done&&!active;h+='<div class="step-group"><div class="step-circle '+(future?"step-future":"step-active")+'">'+(done?"&#10003;":(i+1))+'</div><span class="step-label '+(future?"step-label-future":"step-label-active")+'">'+steps[i]+'</span></div>';if(i<steps.length-1)h+='<div class="step-line"></div>';}h+='</div>';return h;}
function overlay(body,actions){return '<div class="overlay"><div class="overlay-bg"></div><div class="modal"><div class="modal-title">Bulk Import Systems</div><div class="modal-body">'+body+'</div>'+(actions?'<div class="modal-actions">'+actions+'</div>':'')+'</div></div>';}
function summaryBar(ok,fail,total){return '<div class="summary"><div class="summary-tile" style="background:#f9f9f9"><div class="num" style="color:rgba(26,23,59,0.87)">'+total+'</div><div class="lbl" style="color:rgba(26,23,59,0.87)">Total</div></div><div class="summary-tile" style="background:#edf7ed"><div class="num" style="color:#2e7d32">'+ok+'</div><div class="lbl" style="color:#2e7d32">Imported</div></div><div class="summary-tile" style="background:#fdeded"><div class="num" style="color:#d32f2f">'+fail+'</div><div class="lbl" style="color:#d32f2f">Failed</div></div></div>';}
function postNote(type){return '<div class="post-note">&#11015; Post-upload file downloaded: <strong>'+type+'PostUpload-20260303-143022.xlsx</strong></div>';}
var tabsEl=document.getElementById("tabs");
var viewsEl=document.getElementById("views");
views.forEach(function(v,i){
  var btn=document.createElement("button");
  btn.className="tab"+(i===0?" active":"");
  btn.textContent=v.label;
  btn.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
    btn.classList.add("active");
    document.querySelectorAll(".view").forEach(function(el){el.classList.remove("active");});
    document.getElementById("view-"+v.id).classList.add("active");
  };
  tabsEl.appendChild(btn);
  var div=document.createElement("div");
  div.id="view-"+v.id;
  div.className="view"+(i===0?" active":"");
  div.innerHTML=v.html();
  viewsEl.appendChild(div);
});
</script>
</body>
</html>
